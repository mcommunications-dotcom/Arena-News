<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IArena</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
display:flex;
height:100vh;
overflow:hidden;
}

.sidebar{
width:260px;
background:#111827;
padding:20px;
border-right:1px solid #1e293b;
}

.logo{
font-size:34px;
font-weight:bold;
margin-bottom:30px;
}

.logo span{
color:#38bdf8;
}

.menu button{
width:100%;
padding:15px;
margin-bottom:10px;
border:none;
background:#1e293b;
color:white;
border-radius:10px;
cursor:pointer;
font-size:15px;
}

.menu button:hover{
background:#334155;
}

.main{
flex:1;
padding:30px;
overflow:auto;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.timer{
font-size:18px;
font-weight:bold;
color:#38bdf8;
}

.buscar{
background:#38bdf8;
color:black;
font-weight:bold;
padding:12px 20px;
border:none;
border-radius:10px;
cursor:pointer;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
margin-bottom:30px;
}

.stat{
background:#1e293b;
padding:20px;
border-radius:15px;
text-align:center;
}

.stat h2{
margin-top:10px;
font-size:30px;
}

.filtros{
display:flex;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;
}

.filtros input,
.filtros select{
padding:12px;
border:none;
border-radius:8px;
}

.news-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
gap:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
cursor:pointer;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card h3{
margin-bottom:10px;
}

.card p{
margin-bottom:10px;
color:#cbd5e1;
}

.tag{
display:inline-block;
padding:5px 12px;
border-radius:20px;
font-size:12px;
font-weight:bold;
margin-bottom:10px;
}

.alta{
background:#dc2626;
}

.media{
background:#f59e0b;
}

.baixa{
background:#16a34a;
}

.fonte{
font-size:13px;
color:#94a3b8;
}

#fontesPage{
display:none;
}

.lista-fontes li{
margin-bottom:10px;
}

</style>
</head>

<body>

<div class="sidebar">

<div class="logo">
IA<span>rena</span>
</div>

<div class="menu">
<button onclick="mostrarFeed()">📰 Feed</button>
<button onclick="mostrarFontes()">📚 Fontes</button>
</div>

</div>

<div class="main">

<div id="feedPage">

<div class="topbar">

<div>
<h1>Feed Esportivo Inteligente</h1>

<div class="timer">
Próxima atualização:
<span id="contador">60:00</span>
</div>

</div>

<button class="buscar" onclick="buscarNoticias()">
🔄 Atualizar
</button>

</div>

<div class="stats">

<div class="stat">
Notícias
<h2 id="totalNoticias">0</h2>
</div>

<div class="stat">
Fontes
<h2>4</h2>
</div>

<div class="stat">
Esportes
<h2>5</h2>
</div>

</div>

<div class="filtros">

<input
type="text"
id="pesquisa"
placeholder="Pesquisar notícia">

<select id="filtroEsporte">

<option value="">Todos</option>

<option>Futebol</option>
<option>F1</option>
<option>Basquete</option>
<option>Tênis</option>

</select>

</div>

<div id="feedNoticias" class="news-grid">
</div>

</div>

<div id="fontesPage">

<h1>Fontes Monitoradas</h1>

<br>

<ul class="lista-fontes">
<li>Globo Esporte</li>
<li>ESPN Brasil</li>
<li>Band Esportes</li>
<li>TNT Sports</li>
</ul>

</div>

</div>

<script>

function mostrarFeed(){
document.getElementById("feedPage").style.display="block";
document.getElementById("fontesPage").style.display="none";
}

function mostrarFontes(){
document.getElementById("feedPage").style.display="none";
document.getElementById("fontesPage").style.display="block";
}

const noticias = [

{
titulo:"Aguardando integração com notícias reais",
fonte:"IArena",
esporte:"Futebol",
relevancia:"alta",
link:"#"
}

];

function buscarNoticias(){

let html="";

noticias.forEach(noticia=>{

html+=`

<div
class="card"
onclick="window.open('${noticia.link}','_blank')">

<div class="tag ${noticia.relevancia}">
${noticia.relevancia.toUpperCase()}
</div>

<h3>${noticia.titulo}</h3>

<p>
Esporte: ${noticia.esporte}
</p>

<p class="fonte">
Fonte: ${noticia.fonte}
</p>

</div>

`;

});

document.getElementById("feedNoticias").innerHTML=html;

document.getElementById("totalNoticias").innerText=
noticias.length;

}

buscarNoticias();

let tempo = 3600;

setInterval(()=>{

tempo--;

let minutos =
Math.floor(tempo/60);

let segundos =
tempo%60;

document.getElementById("contador").innerText=
String(minutos).padStart(2,'0')
+":"
+
String(segundos).padStart(2,'0');

if(tempo<=0){
tempo=3600;
}

},1000);

</script>

</body>
</html>
